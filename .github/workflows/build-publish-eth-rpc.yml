name: Build and push ETH-RPC image

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      eth_rpc_version:
        description: "pallet-revive-eth-rpc version (e.g. 0.10.0). Leave empty to use the version baked into the Dockerfile."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ETH_RPC_IMAGE_NAME: docker.io/theqfnetwork/eth-rpc

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml
  set-variables:
    # This workaround sets the container image for each job using 'set-variables' job output.
    # env variables don't work for PR from forks, so we need to use outputs.
    runs-on: ubuntu-latest
    needs: isdraft
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Define version
        id: version
        run: |
          export COMMIT_SHA=${{ github.sha }}
          export COMMIT_SHA_SHORT=${COMMIT_SHA:0:8}
          export REF_NAME=${{ github.ref_name }}
          export REF_SLUG=${REF_NAME//\//_}
          VERSION=${REF_SLUG}-${COMMIT_SHA_SHORT}
          echo "VERSION=${REF_SLUG}-${COMMIT_SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "set VERSION=${VERSION}"

  build_docker:
    name: Build docker images
    runs-on: [self-hosted, Linux, X64]
    needs: [set-variables]
    env:
      VERSION: ${{ needs.set-variables.outputs.VERSION }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build eth-rpc Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./substrate/frame/revive/rpc/dockerfiles/eth-rpc/Dockerfile
          push: false
          build-args: |
            ${{ github.event.inputs.eth_rpc_version != '' && format('ETH_RPC_VERSION={0}', github.event.inputs.eth_rpc_version) || '' }}
          tags: |
            ${{ env.ETH_RPC_IMAGE_NAME }}:${{ env.VERSION }}

  build_push_docker:
    name: Build and push docker images
    runs-on: [self-hosted, Linux, X64]
    if: github.ref == 'refs/heads/master'
    needs: [set-variables]
    env:
      VERSION: ${{ needs.set-variables.outputs.VERSION }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build eth-rpc Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./substrate/frame/revive/rpc/dockerfiles/eth-rpc/Dockerfile
          push: true
          build-args: |
            ${{ github.event.inputs.eth_rpc_version != '' && format('ETH_RPC_VERSION={0}', github.event.inputs.eth_rpc_version) || '' }}
          tags: |
            ${{ env.ETH_RPC_IMAGE_NAME }}:${{ env.VERSION }}
